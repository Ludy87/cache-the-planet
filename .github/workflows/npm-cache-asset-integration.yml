name: npm cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet
  CACHE_MANIFEST_BRANCH: cache-data
  FILES_TO_HASH: |
    package-lock.json

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash npm files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash npm files
        id: hash
        env:
          ZIZMOR_VALUE_83: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$ZIZMOR_VALUE_83"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Install and save npm cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Install dependencies
        run: npm ci

      - name: Save npm cache asset
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: shared
          token: ${{ github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/npm
          strict: false

      - name: Upload npm cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is_fork == 'true' || steps.save.outputs.read_only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-npm-${{ needs.hash_pr.outputs.files_hash }}-v1
          path: .cache/npm
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore npm cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Restore npm cache asset - auto
        id: cache-auto
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          allow-shared-restore: true
          strict: true

      - name: Assert exact asset cache hit start with trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_84: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_85: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_86: ${{ github.repository }}
          ZIZMOR_VALUE_87: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_84" = "true"
          test "$ZIZMOR_VALUE_85" = "trusted/$ZIZMOR_VALUE_86/main/npm/linux-x64/$ZIZMOR_VALUE_87/v1"
          test -d .cache/npm

      - name: Assert exact asset cache hit start with untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_88: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_89: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_90: ${{ github.repository }}
          ZIZMOR_VALUE_91: ${{ github.event.pull_request.number }}
          ZIZMOR_VALUE_92: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_88" = "true"
          test "$ZIZMOR_VALUE_89" = "untrusted/$ZIZMOR_VALUE_90/pr-$ZIZMOR_VALUE_91/npm/linux-x64/$ZIZMOR_VALUE_92/v1"
          test -d .cache/npm

      - name: Restore npm cache asset - auto allow shared restore
        id: cache-auto-allow-shared-restore
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          allow-shared-restore: true
          strict: true

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto-allow-shared-restore.outputs.matched-key != '' && startsWith(steps.cache-auto-allow-shared-restore.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_93: ${{ steps.cache-auto-allow-shared-restore.outputs.cache-hit }}
          ZIZMOR_VALUE_94: ${{ steps.cache-auto-allow-shared-restore.outputs.matched-key }}
          ZIZMOR_VALUE_95: ${{ github.repository }}
          ZIZMOR_VALUE_96: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_93" = "true"
          test "$ZIZMOR_VALUE_94" = "shared/$ZIZMOR_VALUE_95/npm/linux-x64/$ZIZMOR_VALUE_96/v1"
          test -d .cache/npm

      - name: Restore npm cache asset - trusted
        id: cache-trusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_97: ${{ steps.cache-trusted.outputs.cache-hit }}
          ZIZMOR_VALUE_98: ${{ steps.cache-trusted.outputs.matched-key }}
          ZIZMOR_VALUE_99: ${{ github.repository }}
          ZIZMOR_VALUE_100: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_97" = "true"
          test "$ZIZMOR_VALUE_98" = "trusted/$ZIZMOR_VALUE_99/main/npm/linux-x64/$ZIZMOR_VALUE_100/v1"

      - name: Restore npm cache asset - shared
        id: cache-shared
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_101: ${{ steps.cache-shared.outputs.cache-hit }}
          ZIZMOR_VALUE_102: ${{ steps.cache-shared.outputs.matched-key }}
          ZIZMOR_VALUE_103: ${{ github.repository }}
          ZIZMOR_VALUE_104: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_101" = "true"
          test "$ZIZMOR_VALUE_102" = "shared/$ZIZMOR_VALUE_103/npm/linux-x64/$ZIZMOR_VALUE_104/v1"

      - name: Restore npm cache asset - untrusted
        id: cache-untrusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_105: ${{ steps.cache-untrusted.outputs.cache-hit }}
          ZIZMOR_VALUE_106: ${{ steps.cache-untrusted.outputs.matched-key }}
          ZIZMOR_VALUE_107: ${{ github.repository }}
          ZIZMOR_VALUE_108: ${{ github.event.pull_request.number }}
          ZIZMOR_VALUE_109: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_105" = "true"
          test "$ZIZMOR_VALUE_106" = "untrusted/$ZIZMOR_VALUE_107/pr-$ZIZMOR_VALUE_108/npm/linux-x64/$ZIZMOR_VALUE_109/v1"

      - name: Verify npm can use restored cache
        run: npm ci --prefer-offline
