name: npm cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  FILES_TO_HASH: |
    package-lock.json

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash npm files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash npm files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Install and save npm cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore npm cache asset
        uses: ./
        with:
          cache-name: npm
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/npm
          strict: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Save npm cache asset
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          cache-name: npm
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/npm
          strict: false
          allow-pr-cache: true

      - name: Upload npm cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is-fork == 'true' || steps.save.outputs.read-only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-npm-${{ needs.hash_pr.outputs.files_hash }}-v1
          path: .cache/npm
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore npm cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Restore npm cache asset - auto
        id: cache-auto
        uses: ./
        with:
          cache-name: npm
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          allow-shared-restore: true
          strict: true

      - name: Assert exact asset cache hit start with trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-auto.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-auto.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "trusted/$CACHE_REPOSITORY/main/npm/linux-x64/$FILES_HASH/v1"
          test -d .cache/npm

      - name: Assert exact asset cache hit start with untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-auto.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-auto.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "untrusted/$CACHE_REPOSITORY/pr-$PR_NUMBER/npm/linux-x64/$FILES_HASH/v1"
          test -d .cache/npm

      - name: Restore npm cache asset - auto allow shared restore
        id: cache-auto-allow-shared-restore
        uses: ./
        with:
          cache-name: npm
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          allow-shared-restore: true
          strict: true

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto-allow-shared-restore.outputs.matched-key != '' && startsWith(steps.cache-auto-allow-shared-restore.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-auto-allow-shared-restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-auto-allow-shared-restore.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "shared/$CACHE_REPOSITORY/npm/linux-x64/$FILES_HASH/v1"
          test -d .cache/npm

      - name: Restore npm cache asset - trusted
        id: cache-trusted
        uses: ./
        with:
          cache-name: npm
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-trusted.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-trusted.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "trusted/$CACHE_REPOSITORY/main/npm/linux-x64/$FILES_HASH/v1"

      - name: Restore npm cache asset - shared
        id: cache-shared
        uses: ./
        with:
          cache-name: npm
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-shared.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-shared.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "shared/$CACHE_REPOSITORY/npm/linux-x64/$FILES_HASH/v1"

      - name: Restore npm cache asset - untrusted
        id: cache-untrusted
        uses: ./
        with:
          cache-name: npm
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-untrusted.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-untrusted.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "untrusted/$CACHE_REPOSITORY/pr-$PR_NUMBER/npm/linux-x64/$FILES_HASH/v1"

      - name: Verify npm can use restored cache
        run: npm ci --prefer-offline --no-audit --no-fund
