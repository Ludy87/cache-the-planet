name: Task cache asset integration
concurrency:
  group: cache-the-planet-main-writes
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet

jobs:
  save-cache:
    name: Run task and save asset cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**')) }}
          path: examples/task-cache/.cache/task
          strict: false

      - name: Run task build
        run: task --taskfile examples/task-cache/Taskfile.yml build

      - name: Save task build cache asset
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**')) }}
          path: examples/task-cache/.cache/task
          strict: true

  restore-cache:
    name: Restore task cache asset in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**')) }}
          path: examples/task-cache/.cache/task
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/${{ github.event.repository.default_branch }}/task/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**') }}/v1"

      - name: Verify restored task cache
        run: task --taskfile examples/task-cache/Taskfile.yml verify
