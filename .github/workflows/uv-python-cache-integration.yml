name: uv Python cache asset integration
concurrency:
  group: cache-the-planet-main-writes
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_CACHE_DIR: ${{ github.workspace }}/.cache/uv/python
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/uv-python

jobs:
  save-cache:
    name: Install and save uv Python asset cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Restore uv and Python asset cache
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/uv-cache/requirements.txt')) }}
          path: .cache/uv
          strict: false

      - name: Install managed Python
        run: uv python install 3.13

      - name: Create environment and populate uv cache
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r examples/uv-cache/requirements.txt

      - name: Save uv and Python asset cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/uv-cache/requirements.txt')) }}
          path: .cache/uv
          strict: true

  restore-cache:
    name: Restore uv Python asset cache in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Restore uv and Python asset cache
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/uv-cache/requirements.txt')) }}
          path: .cache/uv
          strict: true

      - name: Assert exact asset cache hit
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/${{ github.event.repository.default_branch }}/uv-python-3-13/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('examples/uv-cache/requirements.txt') }}/v1"

      - name: Verify managed Python and uv cache offline
        run: |
          uv python find 3.13
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python --offline -r examples/uv-cache/requirements.txt
