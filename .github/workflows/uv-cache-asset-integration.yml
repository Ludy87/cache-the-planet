name: uv dependency cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet
  CACHE_MANIFEST_BRANCH: cache-data
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  FILES_TO_HASH: |
    examples/uv-cache/requirements.txt

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash uv files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Hash uv files
        id: hash
        run: |
          HASH="${{ hashFiles(env.FILES_TO_HASH) }}"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Install and save uv cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Set up Python without native cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv without native GitHub cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          cache-local-path: .cache/uv

      - name: Create virtual environment
        run: uv venv .venv

      - name: Verify Python runtime
        run: python --version

      - name: Restore uv cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          version: 2
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/uv
          strict: false

      - name: Populate uv cache
        run: uv pip install --python .venv/bin/python -r examples/uv-cache/requirements.txt

      - name: Verify uv cache directory
        run: |
          test "$(uv cache dir)" = "$UV_CACHE_DIR"
          test -d "$UV_CACHE_DIR"

      - name: Save uv cache asset
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          version: 2
          scope: shared
          token: ${{ github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/uv
          strict: true
          allow-pr-cache: true

      - name: Upload uv cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is_fork == 'true' || steps.save.outputs.read_only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-uv-${{ needs.hash_pr.outputs.files_hash }}-v2
          path: .cache/uv
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore uv cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python without native cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv without native GitHub cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          cache-local-path: .cache/uv

      - name: Create virtual environment
        run: uv venv .venv

      - name: Verify restored Python runtime
        run: python --version

      - name: Restore uv cache asset - auto
        id: cache-auto
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          version: 2
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          allow-shared-restore: true
          restore-keys: |
            linux-x64/
          path: .cache/uv
          strict: true

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/uv/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'shared/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "shared/${{ github.repository }}/uv/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "untrusted/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/uv/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Restore uv cache asset - trusted
        id: cache-trusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          version: 2
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/uv
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-trusted.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-trusted.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/uv/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Restore uv cache asset - shared
        id: cache-shared
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          version: 2
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/uv
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        run: |
          test "${{ steps.cache-shared.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-shared.outputs.matched-key }}" = "shared/${{ github.repository }}/uv/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Restore uv cache asset - untrusted
        id: cache-untrusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          version: 2
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/uv
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-untrusted.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-untrusted.outputs.matched-key }}" = "untrusted/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/uv/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"
          test -d .cache/uv

      - name: Verify uv can use restored cache
        run: uv pip install --python .venv/bin/python --offline -r examples/uv-cache/requirements.txt
