name: uv dependency cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  FILES_TO_HASH: |
    examples/uv-cache/requirements.txt
  VERSION: 3

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash uv files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash uv files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Install and save uv cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - name: Set up Python without native cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv without native GitHub cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          cache-local-path: .cache/uv

      - name: Create virtual environment
        run: uv venv .venv

      - name: Verify Python runtime
        run: python --version

      - name: Restore uv cache asset
        id: cache
        uses: ./
        with:
          cache-name: uv
          save-scope: shared
          token: ${{ steps.bot-token.outputs.token || github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          allow-shared-restore: true
          version: ${{ env.VERSION }}
          path: .cache/uv
          strict: true

      - name: Populate uv cache
        run: uv pip install --python .venv/bin/python -r examples/uv-cache/requirements.txt

      - name: Verify uv cache directory
        run: |
          test "$(uv cache dir)" = "$UV_CACHE_DIR"
          test -d "$UV_CACHE_DIR"

      - name: Upload uv cache artifact for trusted publisher
        if: ${{ (steps.cache.outputs.is-fork == 'true' || steps.cache.outputs.read-only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-uv-${{ needs.hash_pr.outputs.files_hash }}-v2
          path: .cache/uv
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore uv cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        scope-matrix: 
          - scope: auto
            allow-shared-restore: true
          - scope: trusted
            allow-shared-restore: false
          - scope: untrusted
            allow-shared-restore: false
          - scope: shared
            allow-shared-restore: true
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python without native cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv without native GitHub cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          cache-local-path: .cache/uv

      - name: Create virtual environment
        run: uv venv .venv

      - name: Verify restored Python runtime
        run: python --version

      - name: Restore uv cache asset - ${{ matrix.scope-matrix.scope }}
        id: cache-auto
        uses: ./
        with:
          cache-name: uv
          version: ${{ env.VERSION }}
          scope: ${{ matrix.scope-matrix.scope }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/uv
          allow-shared-restore: ${{ matrix.scope-matrix.allow-shared-restore }}
          restore-only: true
          strict: true
        continue-on-error: true

      - name: Verify uv can use restored cache
        run: uv pip install --python .venv/bin/python --offline -r examples/uv-cache/requirements.txt
        continue-on-error: true
