name: uv Python runtime cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet
  CACHE_MANIFEST_BRANCH: cache-data
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_CACHE_DIR: ${{ github.workspace }}/.cache/uv/python
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/uv-python
  FILES_TO_HASH: |
    examples/uv-cache/requirements.txt

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash uv Python files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash uv Python files
        id: hash
        env:
          ZIZMOR_VALUE_166: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$ZIZMOR_VALUE_166"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Install and save uv Python asset cache
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install managed Python
        run: |
          rm -rf "$UV_PYTHON_INSTALL_DIR"
          uv python install 3.13

      - name: Create environment and populate uv cache
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r examples/uv-cache/requirements.txt

      - name: Save uv and Python asset cache
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          scope: shared
          token: ${{ github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 4
          path: .cache/uv
          strict: false
          allow-pr-cache: true

      - name: Upload uv Python cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is_fork == 'true' || steps.save.outputs.read_only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-uv-python-3-13-${{ needs.hash_pr.outputs.files_hash }}-v4
          path: .cache/uv
          if-no-files-found: error
          retention-days: 1

      - name: Verify uv cache directory
        run: |
          test "$(uv cache dir)" = "$UV_CACHE_DIR"
          test -d "$UV_CACHE_DIR"

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore uv Python asset cache in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Restore uv and Python asset cache - auto
        id: cache-auto
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 4
          allow-shared-restore: true
          restore-keys: |
            linux-x64/
          path: |
            .cache/uv
          strict: true

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_167: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_168: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_169: ${{ github.repository }}
          ZIZMOR_VALUE_170: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_167" = "true"
          test "$ZIZMOR_VALUE_168" = "trusted/$ZIZMOR_VALUE_169/main/uv-python-3-13/linux-x64/$ZIZMOR_VALUE_170/v4"

      - name: Assert shared asset cache fallback
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_171: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_172: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_173: ${{ github.repository }}
          ZIZMOR_VALUE_174: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_171" = "true"
          test "$ZIZMOR_VALUE_172" = "shared/$ZIZMOR_VALUE_173/uv-python-3-13/linux-x64/$ZIZMOR_VALUE_174/v4"

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_175: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_176: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_177: ${{ github.repository }}
          ZIZMOR_VALUE_178: ${{ github.event.pull_request.number }}
          ZIZMOR_VALUE_179: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_175" = "true"
          test "$ZIZMOR_VALUE_176" = "untrusted/$ZIZMOR_VALUE_177/pr-$ZIZMOR_VALUE_178/uv-python-3-13/linux-x64/$ZIZMOR_VALUE_179/v4"

      - name: Restore uv and Python asset cache - trusted
        id: cache-trusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          token: ${{ github.token }}
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 4
          restore-keys: |
            linux-x64/
          path: .cache/uv
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_180: ${{ steps.cache-trusted.outputs.cache-hit }}
          ZIZMOR_VALUE_181: ${{ steps.cache-trusted.outputs.matched-key }}
          ZIZMOR_VALUE_182: ${{ github.repository }}
          ZIZMOR_VALUE_183: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_180" = "true"
          test "$ZIZMOR_VALUE_181" = "trusted/$ZIZMOR_VALUE_182/main/uv-python-3-13/linux-x64/$ZIZMOR_VALUE_183/v4"

      - name: Restore uv and Python asset cache - shared
        id: cache-shared
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          token: ${{ github.token }}
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 4
          restore-keys: |
            linux-x64/
          path: .cache/uv
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_184: ${{ steps.cache-shared.outputs.cache-hit }}
          ZIZMOR_VALUE_185: ${{ steps.cache-shared.outputs.matched-key }}
          ZIZMOR_VALUE_186: ${{ github.repository }}
          ZIZMOR_VALUE_187: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_184" = "true"
          test "$ZIZMOR_VALUE_185" = "shared/$ZIZMOR_VALUE_186/uv-python-3-13/linux-x64/$ZIZMOR_VALUE_187/v4"

      - name: Restore uv and Python asset cache - untrusted
        id: cache-untrusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv-python-3-13
          token: ${{ github.token }}
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 4
          restore-keys: |
            linux-x64/
          path: .cache/uv
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_188: ${{ steps.cache-untrusted.outputs.cache-hit }}
          ZIZMOR_VALUE_189: ${{ steps.cache-untrusted.outputs.matched-key }}
          ZIZMOR_VALUE_190: ${{ github.repository }}
          ZIZMOR_VALUE_191: ${{ github.event.pull_request.number }}
          ZIZMOR_VALUE_192: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_188" = "true"
          test "$ZIZMOR_VALUE_189" = "untrusted/$ZIZMOR_VALUE_190/pr-$ZIZMOR_VALUE_191/uv-python-3-13/linux-x64/$ZIZMOR_VALUE_192/v4"

      - name: Install managed Python from restored download cache
        run: |
          rm -rf "$UV_PYTHON_INSTALL_DIR"
          uv python install 3.13

      - name: Verify restored uv cache
        run: |
          test -d "$UV_CACHE_DIR"

      - name: Verify managed Python and uv cache offline
        run: |
          uv python find 3.13
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python --offline -r examples/uv-cache/requirements.txt
