name: A

on:
  pull_request:

permissions:
  contents: write

jobs:
  test-write-access:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether PR comes from fork
        id: source
        run: |
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show source
        run: |
          echo "Fork: ${{ steps.source.outputs.fork }}"

      - name: Test repository write permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s \
            -o response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs" \
            -d '{
              "ref": "refs/heads/__permission_test_invalid__",
              "sha": "0000000000000000000000000000000000000000"
            }')

          echo "HTTP status: $status"
          cat response.json

          if [[ "$status" == "403" ]]; then
            echo "Kein Schreibzugriff"
          else
            echo "Token hat möglicherweise Schreibzugriff"
          fi
