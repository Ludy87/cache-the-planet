name: Docker cache integration
concurrency:
  group: cache-the-planet-main-writes
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet

jobs:
  save-cache:
    name: Build and save cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Docker cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v2', runner.os, runner.arch, hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt')) }}
          path: examples/docker-cache/.cache/docker-buildx
          # Ein beschädigtes oder fehlendes altes Objekt darf den Reparaturlauf nicht blockieren.
          strict: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build example image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:test
          push: false
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
          cache-to: type=local,dest=examples/docker-cache/.cache/docker-buildx-new,mode=max

      - name: Replace local BuildKit cache
        shell: bash
        run: |
          rm -rf examples/docker-cache/.cache/docker-buildx
          mv examples/docker-cache/.cache/docker-buildx-new examples/docker-cache/.cache/docker-buildx

      - name: Save Docker cache object
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v2', runner.os, runner.arch, hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt')) }}
          path: examples/docker-cache/.cache/docker-buildx
          strict: true

  restore-cache:
    name: Restore cache in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Docker cache
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v2', runner.os, runner.arch, hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt')) }}
          path: examples/docker-cache/.cache/docker-buildx
          strict: true

      - name: Assert exact cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/docker/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt') }}/v2"
          test -d examples/docker-cache/.cache/docker-buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build using restored cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:restored
          push: false
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
