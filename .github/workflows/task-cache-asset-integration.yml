name: Task build cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet
  CACHE_MANIFEST_BRANCH: cache-data
  TASK_TEMP_DIR: ${{ github.workspace }}/examples/task-cache/.cache/task-state
  FILES_TO_HASH: |
    examples/task-cache/Taskfile.yml
    examples/task-cache/src/**

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash Task files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Hash Task files
        id: hash
        run: |
          HASH="${{ hashFiles(env.FILES_TO_HASH) }}"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Run task and save asset cache
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false

      - name: Run task build
        run: task --taskfile examples/task-cache/Taskfile.yml build

      - name: Save task build cache asset
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          scope: shared
          token: ${{ github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false
          allow-pr-cache: true

      - name: Upload task cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is_fork == 'true' || steps.save.outputs.read_only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-task-${{ needs.hash_pr.outputs.files_hash }}-v1
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore task cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset - auto
        id: cache-auto
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          allow-shared-restore: true
          restore-keys: |
            linux-x64/
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: true

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/task/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v1"

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'shared/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "shared/${{ github.repository }}/task/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v1"

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "untrusted/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/task/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v1"

      - name: Restore task build cache asset - trusted
        id: cache-trusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-trusted.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-trusted.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/task/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v1"

      - name: Restore task build cache asset - shared
        id: cache-shared
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        run: |
          test "${{ steps.cache-shared.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-shared.outputs.matched-key }}" = "shared/${{ github.repository }}/task/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v1"

      - name: Restore task build cache asset - untrusted
        id: cache-untrusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-untrusted.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-untrusted.outputs.matched-key }}" = "untrusted/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/task/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v1"

      - name: Verify restored task cache
        run: task --taskfile examples/task-cache/Taskfile.yml verify
