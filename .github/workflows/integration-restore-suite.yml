name: Cache integration restore suite
run-name: "Cache integration restore suite - ${{ github.event.workflow_run.display_title || format('publisher run #{0}', github.event.workflow_run.id) }}"

on:
  workflow_run:
    workflows: [Publish PR cache artifacts]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-restore-cache:
    if: >-
      github.event.workflow_run.name == 'Publish PR cache artifacts' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/npm-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: read

  uv-restore-cache:
    needs: [node-restore-cache]
    if: ${{ !cancelled() && needs.node-restore-cache.result == 'success' }}
    uses: ./.github/workflows/uv-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: read

  uv-python-restore-cache:
    needs: [uv-restore-cache]
    if: ${{ !cancelled() && needs.uv-restore-cache.result == 'success' }}
    uses: ./.github/workflows/uv-python-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: read

  task-restore-cache:
    needs: [uv-python-restore-cache]
    if: ${{ !cancelled() && needs.uv-python-restore-cache.result == 'success' }}
    uses: ./.github/workflows/task-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: read

  java-restore-cache:
    needs: [task-restore-cache]
    if: ${{ !cancelled() && needs.task-restore-cache.result == 'success' }}
    uses: ./.github/workflows/maven-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: read

  gradle-restore-cache:
    needs: [java-restore-cache]
    if: ${{ !cancelled() && needs.java-restore-cache.result == 'success' }}
    uses: ./.github/workflows/gradle-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: read

  docker-restore-cache:
    needs: [gradle-restore-cache]
    if: ${{ !cancelled() && needs.gradle-restore-cache.result == 'success' }}
    uses: ./.github/workflows/docker-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: read

  all-restore-checks-passed:
    name: All restore checks passed
    if: ${{ !cancelled() }}
    needs:
      - node-restore-cache
      - uv-restore-cache
      - uv-python-restore-cache
      - task-restore-cache
      - java-restore-cache
      - gradle-restore-cache
      - docker-restore-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check all restore checks passed
        run: echo "All restore checks passed"

      - name: Verify every required job passed (or was legitimately skipped)
        env:
          JOB_RESULTS: |
            node-restore-cache=${{ needs.node-restore-cache.result }}
            uv-restore-cache=${{ needs.uv-restore-cache.result }}
            uv-python-restore-cache=${{ needs.uv-python-restore-cache.result }}
            task-restore-cache=${{ needs.task-restore-cache.result }}
            java-restore-cache=${{ needs.java-restore-cache.result }}
            gradle-restore-cache=${{ needs.gradle-restore-cache.result }}
            docker-restore-cache=${{ needs.docker-restore-cache.result }}
        shell: bash
        run: |
          while IFS='=' read -r job result; do
            [[ -z "$job" ]] && continue
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job $job did not pass (result: $result)"
              exit 1
            fi
          done <<< "$JOB_RESULTS"
