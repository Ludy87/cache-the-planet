name: Cache integration save suite

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - '**/docs/**'
      - 'manifests/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dist-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/build-dist.yml
    with:
      dry-run: true
    permissions:
      contents: read

  build-dist-trusted:
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/build-dist.yml
    with:
      dry-run: false
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  node-save-cache:
    needs: [build-dist-pr, build-dist-trusted]
    if: ${{ !cancelled() && (needs.build-dist-pr.result == 'success' || needs.build-dist-pr.result == 'skipped') && (needs.build-dist-trusted.result == 'success' || needs.build-dist-trusted.result == 'skipped') }}
    uses: ./.github/workflows/npm-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  uv-save-cache:
    needs: [node-save-cache]
    if: ${{ !cancelled() && needs.node-save-cache.result == 'success' }}
    uses: ./.github/workflows/uv-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  uv-python-save-cache:
    needs: [uv-save-cache]
    if: ${{ !cancelled() && needs.uv-save-cache.result == 'success' }}
    uses: ./.github/workflows/uv-python-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  task-save-cache:
    needs: [uv-python-save-cache]
    if: ${{ !cancelled() && needs.uv-python-save-cache.result == 'success' }}
    uses: ./.github/workflows/task-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  java-save-cache:
    needs: [task-save-cache]
    if: ${{ !cancelled() && needs.task-save-cache.result == 'success' }}
    uses: ./.github/workflows/maven-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  gradle-save-cache:
    needs: [java-save-cache]
    if: ${{ !cancelled() && needs.java-save-cache.result == 'success' }}
    uses: ./.github/workflows/gradle-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  docker-save-cache:
    needs: [gradle-save-cache]
    if: ${{ !cancelled() && needs.gradle-save-cache.result == 'success' }}
    uses: ./.github/workflows/docker-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  all-save-checks-passed:
    name: All save checks passed
    if: ${{ !cancelled() }}
    needs:
      - build-dist-pr
      - build-dist-trusted
      - node-save-cache
      - uv-save-cache
      - uv-python-save-cache
      - task-save-cache
      - java-save-cache
      - gradle-save-cache
      - docker-save-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check all save checks passed
        run: echo "All save checks passed"

      - name: Verify every required job passed (or was legitimately skipped)
        env:
          JOB_RESULTS: |
            build-dist-pr=${{ needs.build-dist-pr.result }}
            build-dist-trusted=${{ needs.build-dist-trusted.result }}
            node-save-cache=${{ needs.node-save-cache.result }}
            uv-save-cache=${{ needs.uv-save-cache.result }}
            uv-python-save-cache=${{ needs.uv-python-save-cache.result }}
            task-save-cache=${{ needs.task-save-cache.result }}
            java-save-cache=${{ needs.java-save-cache.result }}
            gradle-save-cache=${{ needs.gradle-save-cache.result }}
            docker-save-cache=${{ needs.docker-save-cache.result }}
        run: |
          while IFS='=' read -r job_name job_result; do
            [[ -z "$job_name" ]] && continue
            if [[ "$job_result" != "success" && "$job_result" != "skipped" ]]; then
              echo "Job $job_name did not pass (result: $job_result)"
              exit 1
            fi
          done <<< "$JOB_RESULTS"
