name: Rsync cache integration

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      RSYNC_HOST:
        required: false
      RSYNC_PORT:
        required: false
      RSYNC_USERNAME:
        required: false
      RSYNC_PRIVATE_KEY:
        required: false
      RSYNC_BASE_PATH:
        required: false
      RSYNC_KNOWN_HOSTS:
        required: false

permissions:
  contents: write

jobs:
  rsync-cache:
    name: Test Rsync cache storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install archive and Rsync tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync zstd
          rsync --version
          zstd --version
          tar --version

      - name: Prepare test data
        run: |
          mkdir -p .cache/rsync-test
          dd if=/dev/urandom of=.cache/rsync-test/payload.bin bs=1M count=500 status=progress
          printf 'rsync integration test\n' > .cache/rsync-test/payload.txt

      - name: Restore or save through Rsync
        uses: $/
        with:
          token: ${{ github.token }}
          key: rsync-integration-${{ github.run_id }}
          cache-name: rsync-integration
          storage: rsync
          rsync-host: ${{ secrets.RSYNC_HOST }}
          rsync-port: ${{ secrets.RSYNC_PORT || 22 }}
          rsync-username: ${{ secrets.RSYNC_USERNAME }}
          rsync-private-key: ${{ secrets.RSYNC_PRIVATE_KEY }}
          rsync-base-path: ${{ secrets.RSYNC_BASE_PATH || '/home/<rsync_user>/files/cache-the-planet' }}
          rsync-known-hosts: ${{ secrets.RSYNC_KNOWN_HOSTS }}
          path: .cache/rsync-test
          strict: true

      - name: Verify test data
        run: |
          test -f .cache/rsync-test/payload.txt
          test "$(stat -c %s .cache/rsync-test/payload.bin)" -eq 524288000
