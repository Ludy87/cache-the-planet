name: Multi-cache asset integration

on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  NPM_CACHE: ${{ github.workspace }}/.cache/npm
  MAVEN_CACHE: ${{ github.workspace }}/.cache/m2

permissions:
  contents: read

jobs:
  multi-cache:
    if: ${{ inputs.save-cache || inputs.restore-cache }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Create cache repository token
        if: ${{ inputs.save-cache && github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Restore and save multiple caches
        id: cache
        uses: $/multi-cache
        with:
          key: |
            npm=${{ hashFiles('package-lock.json') }}
            maven-java17=${{ hashFiles('examples/java-cache/pom.xml') }}
          multi-cache: |
            npm:
              path: .cache/npm
            maven-java17:
              path: .cache/m2
          allow-shared-restore: true
          token: ${{ steps.bot-token.outputs.token || github.token }}
          restore-only: ${{ inputs.restore-cache && !inputs.save-cache }}
          strict: true

      - name: Verify list outputs for multiple caches
        if: ${{ inputs.save-cache || inputs.restore-cache }}
        env:
          CACHE_HITS: ${{ steps.cache.outputs.cache-hits }}
          MATCHED_KEYS: ${{ steps.cache.outputs.matched-keys }}
          ASSET_NAMES: ${{ steps.cache.outputs.assets-name }}
          CONTENT_HASHES: ${{ steps.cache.outputs.contents-hash }}
          CACHE_SIZES: ${{ steps.cache.outputs.cache-sizes }}
          SINGULAR_HIT: ${{ steps.cache.outputs.cache-hit }}
        shell: bash
        run: |
          test "$(printf '%s\n' "$CACHE_HITS" | wc -l)" -ge 2
          test -n "$MATCHED_KEYS"
          test -n "$ASSET_NAMES"
          test -n "$CONTENT_HASHES"
          test -n "$CACHE_SIZES"
          test -z "$SINGULAR_HIT"

      - name: Verify singular outputs for one cache
        if: ${{ inputs.restore-cache && !inputs.save-cache }}
        id: single-cache
        uses: $/multi-cache
        with:
          key: npm=${{ hashFiles('package-lock.json') }}
          multi-cache: |
            npm:
              path: .cache/npm
          restore-only: true
          strict: true

      - name: Assert singular cache outputs
        if: ${{ inputs.restore-cache && !inputs.save-cache }}
        env:
          CACHE_HIT: ${{ steps.single-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.single-cache.outputs.matched-key }}
          CACHE_HITS: ${{ steps.single-cache.outputs.cache-hits }}
        shell: bash
        run: |
          test -n "$CACHE_HIT"
          test -n "$MATCHED_KEY" || test "$CACHE_HIT" = "false"
          test -z "$CACHE_HITS"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          settings-path: ${{ github.workspace }}/.cache/m2

      - name: Configure cache directories
        run: |
          npm config set cache "$NPM_CACHE" --global
          mkdir -p "$MAVEN_CACHE"

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Maven project
        run: mvn -B -Dmaven.repo.local="$MAVEN_CACHE" package --file examples/java-cache/pom.xml
