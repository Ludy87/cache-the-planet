name: Delete closed pull request cache
concurrency:
  group: pr-cache-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The generated action bundle may be committed just after the PR
          # merge. Always use the current base branch for cleanup.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node dist/pr-cleanup.js
        env:
          PR_REPOSITORY: ${{ github.event.repository.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
