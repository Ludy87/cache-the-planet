name: Java cache asset integration
on:
  workflow_call:

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet

jobs:
  save-cache:
    name: Build and save Maven cache asset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Maven cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/java-cache/pom.xml')) }}
          path: .cache/m2
          strict: false

      - name: Build with Maven
        run: mvn -B -Dmaven.repo.local="$PWD/.cache/m2" package --file examples/java-cache/pom.xml

      - name: Save Maven cache asset
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/java-cache/pom.xml')) }}
          path: .cache/m2
          strict: true

  restore-cache:
    name: Restore Maven cache asset in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Maven cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/java-cache/pom.xml')) }}
          path: .cache/m2
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/maven-java17/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('examples/java-cache/pom.xml') }}/v1"

      - name: Build offline with restored Maven cache
        run: mvn -B -o -Dmaven.repo.local="$PWD/.cache/m2" package --file examples/java-cache/pom.xml
