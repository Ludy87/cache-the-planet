name: uv cache asset integration
concurrency:
  group: cache-the-planet-main-writes
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet

jobs:
  save-cache:
    name: Install and save uv cache asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python without native cache
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up uv without native GitHub cache
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          cache-local-path: .cache/uv

      - name: Create virtual environment
        run: uv venv .venv

      - name: Verify Python runtime
        run: python --version

      - name: Restore uv cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/uv-cache/requirements.txt')) }}
          path: .cache/uv
          strict: false

      - name: Populate uv cache
        run: uv pip install --python .venv/bin/python -r examples/uv-cache/requirements.txt

      - name: Save uv cache asset
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/uv-cache/requirements.txt')) }}
          path: .cache/uv
          strict: true

  restore-cache:
    name: Restore uv cache asset in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python without native cache
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up uv without native GitHub cache
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          cache-local-path: .cache/uv

      - name: Create virtual environment
        run: uv venv .venv

      - name: Verify restored Python runtime
        run: python --version

      - name: Restore uv cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: uv
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('examples/uv-cache/requirements.txt')) }}
          path: .cache/uv
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/${{ github.event.repository.default_branch }}/uv/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('examples/uv-cache/requirements.txt') }}/v1"
          test -d .cache/uv

      - name: Verify uv can use restored cache
        run: uv pip install --python .venv/bin/python --offline -r examples/uv-cache/requirements.txt
