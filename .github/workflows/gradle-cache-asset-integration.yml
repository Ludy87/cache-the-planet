name: Gradle cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
  FILES_TO_HASH: |
    examples/gradle-cache/build.gradle
    examples/gradle-cache/settings.gradle
    examples/gradle-cache/src/**/*.java

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash Gradle files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash Gradle files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Build and save Gradle cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore npm cache asset
        uses: ./
        with:
          cache-name: gradle-java17
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/gradle
          strict: false

      - name: Build with Gradle
        working-directory: examples/gradle-cache
        run: gradle --no-daemon test

      - name: Save Gradle cache asset
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          cache-name: gradle-java17
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/gradle
          strict: false
          allow-pr-cache: true

      - name: Upload Gradle cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is-fork == 'true' || steps.save.outputs.read-only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-gradle-java17-${{ needs.hash_pr.outputs.files_hash }}-v1
          path: .cache/gradle
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore Gradle cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Gradle cache asset - auto
        id: cache-auto
        uses: ./
        with:
          cache-name: gradle-java17
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          allow-shared-restore: true
          restore-keys: |
            linux-x64/
          path: .cache/gradle
          strict: true

      - name: Assert exact asset cache hit start with trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-auto.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-auto.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "trusted/$CACHE_REPOSITORY/main/gradle-java17/linux-x64/$FILES_HASH/v1"

      - name: Assert exact asset cache hit start with untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-auto.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-auto.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "untrusted/$CACHE_REPOSITORY/pr-$PR_NUMBER/gradle-java17/linux-x64/$FILES_HASH/v1"

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-auto.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-auto.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "shared/$CACHE_REPOSITORY/gradle-java17/linux-x64/$FILES_HASH/v1"

      - name: Restore Gradle cache asset - auto with restore-keys
        if: ${{ steps.cache-auto.outputs.cache-hit != 'true' }}
        id: cache-auto-restore-keys
        uses: ./
        with:
          cache-name: gradle-java17
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/gradle
          restore-keys: |
            linux-x64/

      - name: Restore Gradle cache asset - trusted
        id: cache-trusted
        uses: ./
        with:
          cache-name: gradle-java17
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/gradle
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-trusted.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-trusted.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "trusted/$CACHE_REPOSITORY/main/gradle-java17/linux-x64/$FILES_HASH/v1"

      - name: Restore Gradle cache asset - shared
        id: cache-shared
        uses: ./
        with:
          cache-name: gradle-java17
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/gradle
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-shared.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-shared.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "shared/$CACHE_REPOSITORY/gradle-java17/linux-x64/$FILES_HASH/v1"

      - name: Restore Gradle cache asset - untrusted
        id: cache-untrusted
        uses: ./
        with:
          cache-name: gradle-java17
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/gradle
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-untrusted.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache-untrusted.outputs.matched-key }}
          CACHE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$MATCHED_KEY" = "untrusted/$CACHE_REPOSITORY/pr-$PR_NUMBER/gradle-java17/linux-x64/$FILES_HASH/v1"

      - name: Build offline with restored Gradle cache
        working-directory: examples/gradle-cache
        run: gradle --offline --no-daemon test
