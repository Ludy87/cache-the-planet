name: Test
run-name: Test - ${{ github.event_name }}${{ github.event_name == 'workflow_run' && format(' ({0})', github.event.workflow_run.name) || '' }}
on:
  push:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "save/**"
      - "scripts/**"
      - "src/**"
      - ".gitignore"
      - ".release-please-manifest.json"
  workflow_run:
    workflows:
      - Cache integration suite
    types: [completed]
    branches: [main]

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: shared
          key: ${{ hashFiles('package-lock.json') }}
          path: .cache/npm

      - run: npm ci

      - run: npm run test

      - run: bash tests/run.sh

      - name: Save cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          scope: shared
          token: ${{ github.token }}
          key: ${{ hashFiles('package-lock.json') }}
          path: .cache/npm
