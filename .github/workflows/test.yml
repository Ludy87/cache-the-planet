name: Test
run-name: Test - ${{ github.event_name }}${{ github.event_name == 'workflow_run' && format(' ({0})', github.event.workflow_run.name) || '' }}
on:
  push:
  pull_request:
  workflow_run:
    workflows:
      - Build action distribution
      - Docker cache integration
      - Cache integration suite
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run test
      - run: bash tests/run.sh
