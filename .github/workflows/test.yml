name: Test
run-name: Test - ${{ github.event_name }}${{ github.event_name == 'workflow_run' && format(' ({0})', github.event.workflow_run.name) || '' }}
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "save/**"
      - "scripts/**"
      - "src/**"
      - ".gitignore"
      - ".release-please-manifest.json"
  workflow_run:
    workflows:
      - Cache integration save suite
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.name == 'Cache integration save suite' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./
        with:
          cache-name: npm
          scope: shared
          key: ${{ hashFiles('package-lock.json') }}
          path: .cache/npm

      - run: npm ci --no-audit --no-fund

      - name: Run npm tests and publish summary
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee npm-test-output.log
          test_status=${PIPESTATUS[0]}
          tests_count=$(awk '$2 == "tests" { print $3; exit }' npm-test-output.log)
          suites_count=$(awk '$2 == "suites" { print $3; exit }' npm-test-output.log)
          pass_count=$(awk '$2 == "pass" { print $3; exit }' npm-test-output.log)
          fail_count=$(awk '$2 == "fail" { print $3; exit }' npm-test-output.log)
          cancelled_count=$(awk '$2 == "cancelled" { print $3; exit }' npm-test-output.log)
          skipped_count=$(awk '$2 == "skipped" { print $3; exit }' npm-test-output.log)
          todo_count=$(awk '$2 == "todo" { print $3; exit }' npm-test-output.log)
          {
            echo '### npm run test'
            echo
            echo '| Feld | Wert |'
            echo '| --- | --- |'
            if [[ "$test_status" == "0" ]]; then
              echo '| Status | PASS |'
            else
              echo '| Status | FAIL |'
            fi
            echo '| Exit-Code | '"$test_status"' |'
            echo '| Tests | '"${tests_count:-—}"' |'
            echo '| Suites | '"${suites_count:-—}"' |'
            echo '| Bestanden | '"${pass_count:-—}"' |'
            echo '| Fehlgeschlagen | '"${fail_count:-—}"' |'
            echo '| Abgebrochen | '"${cancelled_count:-—}"' |'
            echo '| Übersprungen | '"${skipped_count:-—}"' |'
            echo '| Todo | '"${todo_count:-—}"' |'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - run: bash tests/run.sh

      - name: Save cache
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          cache-name: npm
          scope: shared
          token: ${{ github.token }}
          key: ${{ hashFiles('package-lock.json') }}
          path: .cache/npm
