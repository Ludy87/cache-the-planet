name: Node cache asset integration
on:
  workflow_call:

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet

jobs:
  save-cache:
    name: Install and save npm cache asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Restore npm cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('npm/{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('package-lock.json')) }}
          path: .cache/npm
          strict: false

      - name: Install dependencies
        run: npm ci

      - name: Save npm cache asset
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('npm/{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('package-lock.json')) }}
          path: .cache/npm
          strict: true

  restore-cache:
    name: Restore npm cache asset in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Restore npm cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ format('npm/{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('package-lock.json')) }}
          path: .cache/npm
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/npm/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('package-lock.json') }}/v1"
          test -d .cache/npm

      - name: Verify npm can use restored cache
        run: npm ci --prefer-offline
