name: Cache action demo

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  restore-and-save:
    name: Restore and automatic post-save
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Check out the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Start with an empty demo directory
        run: rm -rf .cache/demo

      - name: Restore and save with the root action
        id: cache
        uses: ./
        with:
          repository: ${{ github.repository }}
          cache-name: demo
          key: cache-action-demo-v1
          path: .cache/demo
          scope: auto
          allow-shared-restore: true
          token: ${{ steps.bot-token.outputs.token || github.token }}
          strict: false

      - name: Create demo content after restore
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/demo
          printf 'Created after the restore step; saved by the automatic post step.\n' > .cache/demo/message.txt

      - name: Show root action result
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache.outputs.matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT}"
          echo "matched-key=${MATCHED_KEY}"
          cat .cache/demo/message.txt

  restore-only:
    name: Restore-only sub-action
    needs: restore-and-save
    runs-on: ubuntu-latest
    steps:
      - name: Check out the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore with ./restore
        id: restore
        uses: ./restore
        with:
          repository: ${{ github.repository }}
          cache-name: demo
          key: cache-action-demo-v1
          path: .cache/demo
          token: ${{ github.token }}

      - name: Show restore-only result
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.restore.outputs.matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT}"
          echo "matched-key=${MATCHED_KEY}"
          test -f .cache/demo/message.txt
          cat .cache/demo/message.txt

  restore-only-failed:
    name: Restore-only failed sub-action
    runs-on: ubuntu-latest
    steps:
      - name: Check out the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore with ./restore
        id: restore
        uses: ./restore
        with:
          repository: ${{ github.repository }}
          cache-name: demo-failed
          key: cache-action-demo-v1
          path: .cache/demo-failed
          token: ${{ github.token }}

      - name: Show restore-only result
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.restore.outputs.matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT}"
          echo "matched-key=${MATCHED_KEY}"
          test -f .cache/demo-failed/message.txt
          cat .cache/demo-failed/message.txt
