name: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  # Release Please creates/updates release metadata and must not race with
  # generated-dist or manifest commits on the default branch.
  group: cache-the-planet-main-writes
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR or GitHub release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create AstraGermany-Bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - name: Update floating major and minor tags
        if: steps.release.outputs.release_created == 'true'
        uses: jimeh/update-tags-action@98d6d448de7488acb52bd8db115673541d019521 # v2
        with:
          derive_from: ${{ steps.release.outputs.tag_name }}
          ref: ${{ steps.release.outputs.sha }}
          annotation: Release ${{ steps.release.outputs.tag_name }}
          github_token: ${{ steps.bot-token.outputs.token || github.token }}
