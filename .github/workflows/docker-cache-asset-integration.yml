name: Docker cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet
  CACHE_MANIFEST_BRANCH: cache-data
  FILES_TO_HASH: |
    examples/docker-cache/Dockerfile
    examples/docker-cache/hello.txt

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash PR Docker files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Checkout PR revision for hashing only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Hash Docker files
        id: hash
        run: |
          HASH="${{ hashFiles(env.FILES_TO_HASH) }}"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Build and save Docker cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}

      - name: echo Dockerfile and context hash
        run: |
          echo "Dockerfile and context hash: ${{ needs.hash_pr.outputs.files_hash }}"

      - name: Restore Docker cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          scope: auto
          token: ${{ github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 2
          allow-shared-restore: true
          restore-keys: |
            linux-x64/
          path: examples/docker-cache/.cache/docker-buildx
          strict: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build example image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:test
          push: false
          outputs: type=cacheonly
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
          cache-to: type=local,dest=examples/docker-cache/.cache/docker-buildx-new,mode=max

      - name: Replace local BuildKit cache
        shell: bash
        run: |
          rm -rf examples/docker-cache/.cache/docker-buildx
          mv examples/docker-cache/.cache/docker-buildx-new examples/docker-cache/.cache/docker-buildx

      - name: Save Docker cache asset
        # if: ${{ github.event.pull_request.head.repo.full_name == github.repository && success() }}
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          # auto saves an isolated PR cache on pull requests and a trusted
          # default-branch cache on main; the action creates the shared alias
          # only from the default branch when appropriate.
          scope: shared
          token: ${{ github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 2
          path: examples/docker-cache/.cache/docker-buildx
          strict: false
          allow-pr-cache: true

      - name: Upload Docker cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is_fork == 'true' || steps.save.outputs.read_only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-docker-${{ needs.hash_pr.outputs.files_hash }}-v2
          path: examples/docker-cache/.cache/docker-buildx
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore Docker cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Restore Docker cache asset - auto
        id: cache-auto
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 2
          allow-shared-restore: true
          restore-keys: |
            linux-x64/
          path: examples/docker-cache/.cache/docker-buildx
          strict: true

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/docker/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'shared/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "shared/${{ github.repository }}/docker/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "untrusted/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/docker/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Restore Docker cache asset - trusted
        id: cache-trusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 2
          restore-keys: |
            linux-x64/
          path: examples/docker-cache/.cache/docker-buildx
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-trusted.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-trusted.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/docker/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Restore Docker cache asset - shared
        id: cache-shared
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 2
          restore-keys: |
            linux-x64/
          path: examples/docker-cache/.cache/docker-buildx
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        run: |
          test "${{ steps.cache-shared.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-shared.outputs.matched-key }}" = "shared/${{ github.repository }}/docker/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Restore Docker cache asset - untrusted
        id: cache-untrusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: docker
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: 2
          restore-keys: |
            linux-x64/
          path: examples/docker-cache/.cache/docker-buildx
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-untrusted.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-untrusted.outputs.matched-key }}" = "untrusted/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/docker/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v2"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build using restored cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:restored
          push: false
          outputs: type=cacheonly
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
