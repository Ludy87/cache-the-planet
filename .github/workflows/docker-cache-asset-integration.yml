name: Docker cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  FILES_TO_HASH: |
    examples/docker-cache/Dockerfile
    examples/docker-cache/hello.txt
  VERSION: 2

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash PR Docker files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Checkout PR revision for hashing only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash Docker files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Build and save Docker cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: echo Dockerfile and context hash
        env:
          FILES_HASH: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          echo "Dockerfile and context hash: $FILES_HASH"

      - name: Restore Docker cache
        id: cache
        uses: ./
        with:
          cache-name: docker
          save-scope: shared
          token: ${{ steps.bot-token.outputs.token || github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: ${{ env.VERSION }}
          allow-shared-restore: true
          path: examples/docker-cache/.cache/docker-buildx
          strict: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build example image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:test
          push: false
          outputs: type=cacheonly
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
          cache-to: type=local,dest=examples/docker-cache/.cache/docker-buildx-new,mode=max

      - name: Replace local BuildKit cache
        shell: bash
        run: |
          rm -rf examples/docker-cache/.cache/docker-buildx
          mv examples/docker-cache/.cache/docker-buildx-new examples/docker-cache/.cache/docker-buildx

      - name: Upload Docker cache artifact for trusted publisher
        if: ${{ (steps.cache.outputs.is-fork == 'true' || steps.cache.outputs.read-only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-docker-${{ needs.hash_pr.outputs.files_hash }}-v2
          path: examples/docker-cache/.cache/docker-buildx
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore Docker cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        scope-matrix: 
          - scope: auto
            allow-shared-restore: true
          - scope: trusted
            allow-shared-restore: false
          - scope: untrusted
            allow-shared-restore: false
          - scope: shared
            allow-shared-restore: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Restore Docker cache asset - ${{ matrix.scope-matrix.scope }}
        id: cache-auto
        uses: ./
        with:
          cache-name: docker
          scope: ${{ matrix.scope-matrix.scope }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: ${{ env.VERSION }}
          path: examples/docker-cache/.cache/docker-buildx
          allow-shared-restore: ${{ matrix.scope-matrix.allow-shared-restore }}
          restore-only: true
          strict: true
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build using restored cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:restored
          push: false
          outputs: type=cacheonly
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
        continue-on-error: true
