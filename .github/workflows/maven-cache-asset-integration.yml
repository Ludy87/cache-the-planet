name: Maven cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet
  CACHE_MANIFEST_BRANCH: cache-data
  FILES_TO_HASH: |
    examples/java-cache/pom.xml

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash Maven files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash Maven files
        id: hash
        env:
          ZIZMOR_VALUE_56: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$ZIZMOR_VALUE_56"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Build and save Maven cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Maven cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/m2
          strict: false

      - name: Build with Maven
        run: mvn -B -Dmaven.repo.local="$PWD/.cache/m2" package --file examples/java-cache/pom.xml

      - name: Save Maven cache asset
        if: ${{ success() }}
        id: save
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          scope: shared
          token: ${{ github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/m2
          strict: false
          allow-pr-cache: true

      - name: Upload Maven cache artifact for trusted publisher
        if: ${{ (steps.save.outputs.is_fork == 'true' || steps.save.outputs.read_only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-maven-java17-${{ needs.hash_pr.outputs.files_hash }}-v1
          path: .cache/m2
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore Maven cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Maven cache asset - auto
        id: cache-auto
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          scope: auto
          key: ${{ needs.hash_pr.outputs.files_hash }}
          allow-shared-restore: true
          restore-keys: |
            linux-x64/
          path: .cache/m2
          strict: true

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_57: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_58: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_59: ${{ github.repository }}
          ZIZMOR_VALUE_60: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_57" = "true"
          test "$ZIZMOR_VALUE_58" = "trusted/$ZIZMOR_VALUE_59/main/maven-java17/linux-x64/$ZIZMOR_VALUE_60/v1"

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_61: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_62: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_63: ${{ github.repository }}
          ZIZMOR_VALUE_64: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_61" = "true"
          test "$ZIZMOR_VALUE_62" = "shared/$ZIZMOR_VALUE_63/maven-java17/linux-x64/$ZIZMOR_VALUE_64/v1"

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_65: ${{ steps.cache-auto.outputs.cache-hit }}
          ZIZMOR_VALUE_66: ${{ steps.cache-auto.outputs.matched-key }}
          ZIZMOR_VALUE_67: ${{ github.repository }}
          ZIZMOR_VALUE_68: ${{ github.event.pull_request.number }}
          ZIZMOR_VALUE_69: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_65" = "true"
          test "$ZIZMOR_VALUE_66" = "untrusted/$ZIZMOR_VALUE_67/pr-$ZIZMOR_VALUE_68/maven-java17/linux-x64/$ZIZMOR_VALUE_69/v1"

      - name: Restore Maven cache asset - trusted
        id: cache-trusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          scope: trusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/m2
          strict: false

      - name: Assert exact asset cache hit - trusted
        if: ${{ steps.cache-trusted.outputs.matched-key != '' && startsWith(steps.cache-trusted.outputs.matched-key, 'trusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_70: ${{ steps.cache-trusted.outputs.cache-hit }}
          ZIZMOR_VALUE_71: ${{ steps.cache-trusted.outputs.matched-key }}
          ZIZMOR_VALUE_72: ${{ github.repository }}
          ZIZMOR_VALUE_73: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_70" = "true"
          test "$ZIZMOR_VALUE_71" = "trusted/$ZIZMOR_VALUE_72/main/maven-java17/linux-x64/$ZIZMOR_VALUE_73/v1"

      - name: Restore Maven cache asset - shared
        id: cache-shared
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          scope: shared
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/m2
          strict: false

      - name: Assert exact asset cache hit - shared
        if: ${{ steps.cache-shared.outputs.matched-key != '' && startsWith(steps.cache-shared.outputs.matched-key, 'shared/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_74: ${{ steps.cache-shared.outputs.cache-hit }}
          ZIZMOR_VALUE_75: ${{ steps.cache-shared.outputs.matched-key }}
          ZIZMOR_VALUE_76: ${{ github.repository }}
          ZIZMOR_VALUE_77: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_74" = "true"
          test "$ZIZMOR_VALUE_75" = "shared/$ZIZMOR_VALUE_76/maven-java17/linux-x64/$ZIZMOR_VALUE_77/v1"

      - name: Restore Maven cache asset - untrusted
        id: cache-untrusted
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: maven-java17
          scope: untrusted
          key: ${{ needs.hash_pr.outputs.files_hash }}
          restore-keys: |
            linux-x64/
          path: .cache/m2
          strict: false

      - name: Assert exact asset cache hit - untrusted
        if: ${{ steps.cache-untrusted.outputs.matched-key != '' && startsWith(steps.cache-untrusted.outputs.matched-key, 'untrusted/') }}
        shell: bash
        env:
          ZIZMOR_VALUE_78: ${{ steps.cache-untrusted.outputs.cache-hit }}
          ZIZMOR_VALUE_79: ${{ steps.cache-untrusted.outputs.matched-key }}
          ZIZMOR_VALUE_80: ${{ github.repository }}
          ZIZMOR_VALUE_81: ${{ github.event.pull_request.number }}
          ZIZMOR_VALUE_82: ${{ needs.hash_pr.outputs.files_hash }}
        run: |
          test "$ZIZMOR_VALUE_78" = "true"
          test "$ZIZMOR_VALUE_79" = "untrusted/$ZIZMOR_VALUE_80/pr-$ZIZMOR_VALUE_81/maven-java17/linux-x64/$ZIZMOR_VALUE_82/v1"

      - name: Build offline with restored Maven cache
        run: mvn -B -o -Dmaven.repo.local="$PWD/.cache/m2" package --file examples/java-cache/pom.xml
