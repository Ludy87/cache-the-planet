name: Maven cache asset integration
on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  FILES_TO_HASH: |
    examples/java-cache/pom.xml

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash Maven files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash Maven files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    if: ${{ inputs.save-cache }}
    name: Build and save Maven cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Maven cache asset
        id: cache
        uses: ./
        with:
          cache-name: maven-java17
          save-scope: shared
          token: ${{ steps.bot-token.outputs.token || github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          allow-shared-restore: true
          path: .cache/m2
          strict: true

      - name: Build with Maven
        run: mvn -B -Dmaven.repo.local="$PWD/.cache/m2" package --file examples/java-cache/pom.xml

      - name: Upload Maven cache artifact for trusted publisher
        if: ${{ (steps.cache.outputs.is-fork == 'true' || steps.cache.outputs.read-only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-maven-java17-${{ needs.hash_pr.outputs.files_hash }}-v1
          path: .cache/m2
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore Maven cache asset in a fresh job
    needs: [hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        scope-matrix: 
          - scope: auto
            allow-shared-restore: true
          - scope: trusted
            allow-shared-restore: false
          - scope: untrusted
            allow-shared-restore: false
          - scope: shared
            allow-shared-restore: true
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Maven cache asset - ${{ matrix.scope-matrix.scope }}
        id: cache-auto
        uses: ./
        with:
          cache-name: maven-java17
          scope: ${{ matrix.scope-matrix.scope }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: .cache/m2
          allow-shared-restore: ${{ matrix.scope-matrix.allow-shared-restore }}
          restore-only: true
          strict: true
        continue-on-error: true

      - name: Build offline with restored Maven cache
        run: mvn -B -o -Dmaven.repo.local="$PWD/.cache/m2" package --file examples/java-cache/pom.xml
        continue-on-error: true
