name: Publish fork artifact cache metadata

on:
  workflow_run:
    workflows: [Cache integration save suite]
    types: [completed]

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Create publisher token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Show source workflow run
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          echo "Publisher run: ${GITHUB_RUN_ID}"
          echo "Source run: ${SOURCE_RUN_ID}"
          echo "Source workflow: ${SOURCE_WORKFLOW}"
          echo "Source event: ${SOURCE_EVENT}"
          echo "Source SHA: ${SOURCE_SHA}"

      - name: Resolve fork metadata artifacts
        id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/fork-metadata-artifacts.json"
          node <<'NODE'
          const fs = require("fs");
          const artifacts = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/fork-metadata-artifacts.json", "utf8"),
          ).artifacts || [];
          const names = artifacts
            .map((artifact) => artifact.name)
            .filter((name) => /^cache-the-planet-pr-([1-9]\d*)-metadata-[0-9a-f]{16,64}$/i.test(name));
          const pullRequests = [...new Set(names.map((name) => name.match(/^cache-the-planet-pr-([1-9]\d*)-/i)[1]))];
          if (pullRequests.length > 1)
            throw new Error(`metadata artifacts identify multiple pull requests: ${pullRequests.join(", ")}`);
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `number=${pullRequests[0] || ""}\ncount=${names.length}\n`);
          console.log(`Found ${names.length} metadata artifact(s) for PR ${pullRequests[0] || "none"}.`);
          NODE

      - name: Download fork metadata artifacts
        if: ${{ steps.metadata.outputs.count != '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: cache-the-planet-pr-${{ steps.metadata.outputs.number }}-metadata-*
          path: fork-artifacts
          merge-multiple: false

      - name: Publish validated metadata references
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_ARTIFACT_TOKEN: ${{ github.token }}
          FORK_ARTIFACT_METADATA_DIR: ${{ github.workspace }}/fork-artifacts
        run: node scripts/publish-fork-artifact-metadata.js
