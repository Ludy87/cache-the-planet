name: Publish PR cache artifacts

on:
  workflow_run:
    workflows: [Cache integration save suite]
    types: [completed]
    # branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    # if: ${{ github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.pull_requests[0] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Create AstraGermany-Bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet

      - name: Download PR cache artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: cache-the-planet-pr-*
          path: pr-cache-artifacts
          merge-multiple: false

      - name: Resolve pull request number from artifact names
        id: pr
        run: |
          PR_NUMBER="$(find pr-cache-artifacts -mindepth 1 -maxdepth 1 -type d -name 'cache-the-planet-pr-*' \
            -printf '%f\n' 2>/dev/null | sed -n 's/^cache-the-planet-pr-\([0-9][0-9]*\)-.*/\1/p' | sort -u)"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR cache artifacts found; nothing to publish."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$PR_NUMBER" != "null"
          test "$(printf '%s\n' "$PR_NUMBER" | wc -l)" = 1
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Publish isolated PR caches
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          CACHE_REPOSITORY: Ludy87/cache-the-planet
          CACHE_MANIFEST_BRANCH: cache-data
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_CACHE_ARTIFACTS_DIR: ${{ github.workspace }}/pr-cache-artifacts
        run: node scripts/publish-pr-cache-artifacts.js
