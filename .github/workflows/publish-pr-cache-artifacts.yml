name: Publish PR cache artifacts

on:
  workflow_run:
    workflows: [Cache integration suite]
    types: [completed]
    # branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  publish:
    # if: ${{ github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.pull_requests[0] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Create AstraGermany-Bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet

      - name: Download PR cache artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: cache-the-planet-pr-*
          path: pr-cache-artifacts
          merge-multiple: false

      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER="$(gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=all \
            -f head="${HEAD_REPOSITORY}:${HEAD_BRANCH}" \
            --jq '.[0].number')"
          test -n "$PR_NUMBER" && test "$PR_NUMBER" != "null"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Publish isolated PR caches
        env:
          CACHE_REPOSITORY: Ludy87/cache-the-planet
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_CACHE_ARTIFACTS_DIR: ${{ github.workspace }}/pr-cache-artifacts
        run: node scripts/publish-pr-cache-artifacts.js
