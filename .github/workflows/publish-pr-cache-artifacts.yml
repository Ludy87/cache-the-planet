name: Publish PR cache artifacts
run-name: "Publish PR cache artifacts - ${{ github.event.workflow_run.display_title || format('run #{0}', github.event.workflow_run.id) }}"

on:
  workflow_run:
    workflows: [Cache integration save suite]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Cache integration save suite' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Create AstraGermany-Bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Resolve PR cache artifact names
        id: pr
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/pr-cache-artifacts.json"
          node <<'NODE'
          const fs = require("fs");
          const output = process.env.GITHUB_OUTPUT;
          const artifacts = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/pr-cache-artifacts.json", "utf8"),
          ).artifacts || [];
          const names = artifacts
            .map((artifact) => artifact.name)
            .filter((name) =>
              /^cache-the-planet-pr-[1-9]\d*-[A-Za-z0-9_-]{1,32}-[0-9a-f]{8,128}-v[1-9]\d*$/i.test(
                name,
              ),
            );
          const pullRequests = [
            ...new Set(
              names.map((name) =>
                name.match(/^cache-the-planet-pr-([1-9]\d*)-/)[1],
              ),
            ),
          ];
          if (pullRequests.length > 1) {
            throw new Error(
              `artifacts identify multiple pull requests: ${pullRequests.join(", ")}`,
            );
          }
          fs.appendFileSync(
            output,
            `number=${pullRequests[0] || ""}\ncount=${names.length}\nname=${
              names.length === 1 ? names[0] : ""
            }\n`,
          );
          if (!names.length) {
            console.log("No PR cache artifacts found; nothing to publish.");
          }
          NODE
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Download single PR cache artifact
        if: ${{ steps.pr.outputs.count == '1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: ${{ steps.pr.outputs.name }}
          path: pr-cache-artifacts/${{ steps.pr.outputs.name }}

      - name: Download multiple PR cache artifacts
        if: ${{ steps.pr.outputs.count > 1 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: cache-the-planet-pr-*
          path: pr-cache-artifacts
          merge-multiple: false

      - name: Publish isolated PR caches
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_WORKFLOW: Cache integration save suite
          CACHE_CONFIG_FILE: .cache-the-planet.json
          PR_CACHE_ARTIFACTS_DIR: ${{ github.workspace }}/pr-cache-artifacts
        run: node scripts/publish-pr-cache-artifacts.js
