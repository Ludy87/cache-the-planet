name: Docker QEMU cache asset integration

on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  FILES_TO_HASH: |
    examples/docker-cache/Dockerfile
    examples/docker-cache/hello.txt
  VERSION: 1
  QEMU_IMAGE: docker.io/tonistiigi/binfmt:latest
  QEMU_IMAGE_TAR: .cache/docker-qemu/qemu-binfmt.tar

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash PR Docker files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Checkout PR revision for hashing only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash Docker files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: |
          HASH="$FILES_HASH"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"

  save-cache:
    if: ${{ inputs.save-cache }}
    name: Build and save Docker QEMU cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Restore Docker and QEMU cache asset
        id: cache
        uses: $/
        with:
          cache-name: docker-qemu
          save-scope: shared
          token: ${{ steps.bot-token.outputs.token || github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: ${{ env.VERSION }}
          allow-shared-restore: true
          path: .cache/docker-qemu
          strict: true

      - name: Pull and archive QEMU image on cache miss
        shell: bash
        run: |
          if [ ! -s "$QEMU_IMAGE_TAR" ]; then
            mkdir -p "$(dirname "$QEMU_IMAGE_TAR")"
            docker pull "$QEMU_IMAGE"
            docker save "$QEMU_IMAGE" --output "$QEMU_IMAGE_TAR"
          fi

      - name: Load QEMU image from cache artifact
        run: docker load --input "$QEMU_IMAGE_TAR"

      - name: Set up QEMU without native action cache
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Detect restored BuildKit cache
        id: buildkit-cache
        shell: bash
        run: |
          if [ -f .cache/docker-qemu/index.json ]; then
            echo 'cache-from=type=local,src=.cache/docker-qemu' >> "$GITHUB_OUTPUT"
          else
            echo 'cache-from=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build example image with QEMU
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          platforms: linux/arm64
          tags: cache-the-planet-example:qemu
          push: false
          outputs: type=cacheonly
          cache-from: ${{ steps.buildkit-cache.outputs.cache-from }}
          cache-to: type=local,dest=.cache/docker-qemu-buildx-new,mode=max

      - name: Replace local BuildKit cache
        shell: bash
        run: |
          rm -rf .cache/docker-qemu
          mv .cache/docker-qemu-buildx-new .cache/docker-qemu

      - name: Display cache information
        env:
          CACHE_IS_FORK: ${{ steps.cache.outputs.is-fork }}
          CACHE_READ_ONLY: ${{ steps.cache.outputs.read-only }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        shell: bash
        run: |
          echo "Fork: $CACHE_IS_FORK"
          echo "Read-only: $CACHE_READ_ONLY"
          echo "Cache Hit: $CACHE_HIT"

      - name: Upload Docker and QEMU cache artifact for trusted publisher
        if: ${{ steps.cache.outputs.cache-hit == 'false' && github.event_name == 'pull_request' && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-docker-qemu-${{ needs.hash_pr.outputs.files_hash }}-v${{ env.VERSION }}
          path: .cache/docker-qemu
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore Docker QEMU cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Restore Docker and QEMU cache asset
        uses: $/
        with:
          cache-name: docker-qemu
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: ${{ env.VERSION }}
          path: .cache/docker-qemu
          restore-only: true
          strict: true

      - name: Load QEMU image from cache artifact
        run: docker load --input "$QEMU_IMAGE_TAR"

      - name: Set up QEMU without native action cache
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Detect restored BuildKit cache
        id: buildkit-cache
        shell: bash
        run: |
          if [ -f .cache/docker-qemu/index.json ]; then
            echo 'cache-from=type=local,src=.cache/docker-qemu' >> "$GITHUB_OUTPUT"
          else
            echo 'cache-from=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build using restored QEMU cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          platforms: linux/arm64
          tags: cache-the-planet-example:qemu-restored
          push: false
          outputs: type=cacheonly
          cache-from: ${{ steps.buildkit-cache.outputs.cache-from }}
