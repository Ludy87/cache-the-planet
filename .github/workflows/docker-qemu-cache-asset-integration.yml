name: Docker QEMU cache asset integration

on:
  workflow_call:
    inputs:
      save-cache:
        required: false
        type: boolean
        default: false
      restore-cache:
        required: false
        type: boolean
        default: false

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

env:
  FILES_TO_HASH: |
    examples/docker-cache/Dockerfile
    examples/docker-cache/hello.txt
  VERSION: 1
  QEMU_IMAGE: docker.io/tonistiigi/binfmt:latest
  QEMU_IMAGE_TAR: examples/docker-cache/.cache/qemu-binfmt.tar

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash PR Docker files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - name: Checkout PR revision for hashing only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash Docker files
        id: hash
        env:
          FILES_HASH: ${{ hashFiles(env.FILES_TO_HASH) }}
        run: echo "files_hash=$FILES_HASH" >> "$GITHUB_OUTPUT"

  save-cache:
    if: ${{ inputs.save-cache }}
    name: Build and save Docker QEMU cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Create AstraGermany-Bot token for trusted save
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.user.login == 'Ludy87' && github.event.pull_request.head.repo.full_name == github.repository) }}
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Ludy87
          repositories: cache-the-planet
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Restore Docker and QEMU cache asset
        id: cache
        uses: $/
        with:
          cache-name: docker-qemu
          save-scope: shared
          token: ${{ steps.bot-token.outputs.token || github.token }}
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: ${{ env.VERSION }}
          allow-shared-restore: true
          path: examples/docker-cache/.cache
          strict: true

      - name: Pull and archive QEMU image on cache miss
        shell: bash
        run: |
          if [ ! -s "$QEMU_IMAGE_TAR" ]; then
            mkdir -p "$(dirname "$QEMU_IMAGE_TAR")"
            docker pull "$QEMU_IMAGE"
            docker save "$QEMU_IMAGE" --output "$QEMU_IMAGE_TAR"
          fi

      - name: Load QEMU image from cache artifact
        run: docker load --input "$QEMU_IMAGE_TAR"

      - name: Set up QEMU without native action cache
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build example image with QEMU
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          platforms: linux/arm64
          tags: cache-the-planet-example:qemu
          push: false
          outputs: type=cacheonly
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
          cache-to: type=local,dest=examples/docker-cache/.cache/docker-buildx-new,mode=max

      - name: Replace local BuildKit cache
        shell: bash
        run: |
          rm -rf examples/docker-cache/.cache/docker-buildx
          mv examples/docker-cache/.cache/docker-buildx-new examples/docker-cache/.cache/docker-buildx

      - name: Display cache information
        env:
          CACHE_IS_FORK: ${{ steps.cache.outputs.is-fork }}
          CACHE_READ_ONLY: ${{ steps.cache.outputs.read-only }}
        run: |
          echo "Fork: $CACHE_IS_FORK"
          echo "Read-only: $CACHE_READ_ONLY"

      - name: Upload Docker and QEMU cache artifact for trusted publisher
        if: ${{ (steps.cache.outputs.is-fork == 'true' || steps.cache.outputs.read-only == 'true') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-the-planet-pr-${{ github.event.pull_request.number }}-docker-qemu-${{ needs.hash_pr.outputs.files_hash }}-v${{ env.VERSION }}
          path: examples/docker-cache/.cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  restore-cache:
    if: ${{ inputs.restore-cache }}
    name: Restore Docker QEMU cache asset
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Restore Docker and QEMU cache asset
        uses: $/
        with:
          cache-name: docker-qemu
          key: ${{ needs.hash_pr.outputs.files_hash }}
          version: ${{ env.VERSION }}
          path: examples/docker-cache/.cache
          restore-only: true
          strict: true

      - name: Load QEMU image from cache artifact
        run: docker load --input "$QEMU_IMAGE_TAR"

      - name: Set up QEMU without native action cache
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build using restored QEMU cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          platforms: linux/arm64
          tags: cache-the-planet-example:qemu-restored
          push: false
          outputs: type=cacheonly
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
