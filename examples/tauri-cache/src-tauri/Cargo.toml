[package]
name = "tauri-cache-example"
version = "0.1.0"
description = "Minimal Tauri application used by cache-the-planet integration tests"
authors = ["cache-the-planet"]
edition = "2021"

[lib]
name = "tauri_cache_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
