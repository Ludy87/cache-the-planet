name: Content-addressed GitHub cache
description: Immutable, deduplicated cache objects stored as GitHub Release assets
author: cache-the-planet
inputs:
  repository:
    description: "owner/name of cache repository"
    required: false
    default: ""
  key:
    description: "Logical dependency key; namespace and platform are generated from scope, os, arch, and version"
    required: true
  cache-name:
    description: "Cache name using only letters, numbers, hyphens, or underscores"
    required: true
  scope:
    description: "Cache scope; defaults to scope in config or auto"
    required: false
    default: ""
  save-scope:
    description: "Scope for post-save; defaults to scope"
    required: false
    default: ""
  os:
    description: "Operating system component of the cache key; defaults to RUNNER_OS"
    required: false
    default: "__runner__"
  arch:
    description: "Architecture component of the cache key; defaults to RUNNER_ARCH"
    required: false
    default: "__runner__"
  version:
    description: "Numeric cache format version; defaults to version in config or 1"
    required: false
    default: ""
  restore-keys:
    description: "Newline separated fallback prefixes"
    required: false
    default: ""
  path:
    description: "Newline separated files or directories to cache"
    required: true
  token:
    description: "GitHub token; defaults to GITHUB_TOKEN"
    required: false
  storage:
    description: "Object storage backend: github-release, sftp, or rsync"
    required: false
  sftp-host:
    description: "SFTP hostname"
    required: false
  sftp-port:
    description: "SFTP port"
    required: false
  sftp-username:
    description: "SFTP username"
    required: false
  sftp-private-key:
    description: "SFTP private key; preferably supplied from a secret"
    required: false
  sftp-password:
    description: "SFTP password; preferably supplied from a secret"
    required: false
  sftp-base-path:
    description: "Absolute SFTP directory for immutable cache objects"
    required: false
  rsync-host:
    description: "Rsync SSH hostname"
    required: false
  rsync-port:
    description: "Rsync SSH port"
    required: false
  rsync-username:
    description: "Rsync SSH username"
    required: false
  rsync-private-key:
    description: "Rsync SSH private key; preferably supplied from a secret"
    required: false
  rsync-base-path:
    description: "Absolute remote directory for immutable cache objects"
    required: false
  rsync-known-hosts:
    description: "SSH known_hosts entry for the Rsync server; preferably supplied from a secret"
    required: false
  encryption-key:
    description: "Optional AES-256 encryption key or passphrase for cache contents"
    required: false
    default: ""
  strict:
    description: "Fail the restore step on cache errors"
    required: false
    default: "false"
  strict-save:
    description: "Fail the save step on cache errors"
    required: false
    default: ""
  config-file:
    description: "Optional JSON configuration file; environment variables override its values"
    required: false
    default: ""
  manifest-branch:
    description: "Branch containing the cache manifest; defaults to manifest_branch in config or cache-data"
    required: false
    default: ""
  manifest-path:
    description: "Repository directory containing the manifest; when set without manifest-branch, the default branch is used"
    required: false
    default: ""
  allow-shared-restore:
    description: "Allow pull requests to restore explicitly selected shared caches"
    required: false
    default: "false"
  restore-only:
    description: "Only restore the cache; reserved for post-save behavior"
    required: false
    default: "false"
  compression-level:
    description: "zstd compression level; defaults to compression_level in config"
    required: false
    default: ""
  exclude:
    description: "Newline separated exclusions for post-save"
    required: false
    default: ""
  exclude-path:
    description: "Newline separated workspace-relative files containing exclusion patterns for post-save"
    required: false
    default: ""
  allow-pr-cache:
    description: "Allow saving an isolated untrusted cache for a pull request during post-save"
    required: false
    default: "true"
outputs:
  error:
    description: "Error message when cache restore or save fails"
  cache-hit:
    description: "true when an exact key was restored"
  matched-key:
    description: "Reference key used for restore"
  is-fork:
    description: "true when the save runs for a pull request whose source repository is a fork"
  read-only:
    description: "true when the save will not write a cache because the pull request is from a fork"
  content-hash:
    description: "sha256 digest of the object"
  asset-name:
    description: "Release asset filename for the cached object"
  cache-size:
    description: "Compressed object size in bytes"
branding:
  icon: archive
  color: blue

runs:
  using: node24
  main: dist/restore.js
  post: dist/save.js
  post-if: "success()"
