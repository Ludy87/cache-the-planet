name: Content-addressed GitHub cache (save)
description: Save an immutable content-addressed cache object
inputs:
  repository:
    description: "owner/name of cache repository"
    required: false
    default: ""
  key:
    description: "Logical dependency key; namespace and platform are generated from scope, os, arch, and version"
    required: true
  cache-name:
    description: "Cache name using only letters, numbers, hyphens, or underscores"
    required: true
  scope:
    description: "Cache scope: auto, shared, trusted, or untrusted"
    required: false
    default: auto
  os:
    description: "Operating system component of the cache key; defaults to RUNNER_OS"
    required: false
    default: "__runner__"
  arch:
    description: "Architecture component of the cache key; defaults to RUNNER_ARCH"
    required: false
    default: "__runner__"
  version:
    description: "Numeric cache format version, for example 1 or 2"
    required: false
    default: "1"
  path:
    description: "Newline separated files or directories to cache"
    required: true
  compression-level:
    description: "zstd compression level"
    required: false
    default: "3"
  token:
    description: "GitHub token; defaults to GITHUB_TOKEN"
    required: false
  encryption-key:
    description: "Optional AES-256 encryption key or passphrase for cache contents"
    required: false
    default: ""
  exclude:
    description: "Newline separated exclusions"
    required: false
    default: ""
  exclude-path:
    description: "Newline separated workspace-relative files containing exclusion patterns"
    required: false
    default: ""
  strict:
    description: "Fail the step on cache errors"
    required: false
    default: "false"
  config-file:
    description: "Optional JSON configuration file; environment variables override its values"
    required: false
    default: ""
  manifest-branch:
    description: "Branch containing the cache manifest; defaults to manifest_branch in config or cache-data"
    required: false
    default: ""
  allow-pr-cache:
    description: "Allow saving an isolated untrusted cache for a pull request"
    required: false
    default: "true"
outputs:
  is-fork:
    description: "true when the save runs for a pull request whose source repository is a fork"
  read-only:
    description: "true when the action will not write a cache because the pull request is from a fork"
  content-hash:
    description: "sha256 digest of the object"
  asset-name:
    description: "Release asset filename for the cached object"
  cache-size:
    description: "Compressed object size in bytes"
runs:
  using: node24
  main: ../dist/save.js
