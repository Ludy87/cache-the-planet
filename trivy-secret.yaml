# ssh2 contains this public-source Ed25519 capability-test key in its protocol
# constants. It is not an operational credential. Keep this exception exact
# and path-scoped so real secrets remain findings.
allow-rules:
  - id: ssh2-bundled-ed25519-capability-test-key
    description: Allow the non-secret ssh2 Ed25519 capability-test key in generated bundles
    path: .*[\\/]d(?:ist)[\\/](common|gc|multi-cache-save|multi-cache|pr-cleanup|restore|save)\.js$
    regex: '-----BEGIN PRIVATE KEY-----\\r?\\nMC4CAQAwBQYDK2VwBCIEIHKj\\+sVa9wCD/q2DJUJaf43Kptc8xYuUQA4bOFj9vC8T\\r?\\n-----END PRIVATE KEY-----'
